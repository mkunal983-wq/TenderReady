services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tenderready
      POSTGRES_PASSWORD: tenderready
      POSTGRES_DB: tenderready
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderready"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tenderready:tenderready@db:5432/tenderready
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tenderready:tenderready@db:5432/tenderready
      STORAGE_DIR: /app/data/documents
      APP_ENV: production
      APP_API_TOKEN: ${APP_API_TOKEN:?Set APP_API_TOKEN to at least 32 characters in .env before starting Compose}
    volumes:
      - documents_data:/app/data/documents
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  documents_data:
